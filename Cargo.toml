[package]
name = "titan_image"
version = "0.9.1"
edition = "2021"
autobins = false
description = "Phone-first modular morphogenic visual dynamics laboratory"
build = "build.rs"

[dependencies]
anyhow = "1"
candle-core = "0.10"
candle-nn = "0.10"
ctrlc = "3"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
rand = "0.8"
rand_chacha = "0.3"
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
opencl3 = { version = "0.12.3", optional = true, default-features = false, features = ["dynamic", "CL_VERSION_1_2"] }

[features]
default = []
opencl = ["dep:opencl3"]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"

[[bin]]
name = "titan_image"
path = "src/main.rs"
